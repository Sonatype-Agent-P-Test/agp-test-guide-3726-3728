#
# AGP local-image testing workflow (template).
# Copy to .github/workflows/agp-workflow.yml in each test repo.
#
# Differences from the standard onboarded workflow:
#   - The OIDC `gate` job is removed. The local backend 401s on GitHub OIDC, so we
#     authenticate with a PAT (AGP_API_TOKEN) and run the `agp` job directly.
#   - runs-on: self-hosted — GitHub-hosted runners can't reach the local image or backend.
#   - docker-image + skip-docker-pull use the locally-built image already on the runner host.
#
# Required repo config:
#   vars:    AGP_API_URL (ngrok tunnel), AGP_DOCKER_IMAGE (local image tag)
#   secret:  AGP_API_TOKEN (Guide PAT)
#
name: Sonatype Guide - Agent P (local test)

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose output'
        required: false
        default: 'false'
        type: boolean
      mode:
        description: 'Run mode (standard, security, or heal)'
        required: false
        default: 'standard'
        type: string
      repo_id:
        description: 'Sonatype Guide repository id (heal mode)'
        required: false
        type: number
      vulnerabilities:
        description: 'JSON array of vulnerabilities to target (security mode)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agp-workflow
  cancel-in-progress: false

jobs:
  agp:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AGP
        uses: sonatype/agp-action@v1
        with:
          mode: ${{ inputs.mode || 'standard' }}
          repo_id: ${{ inputs.repo_id || '' }}
          vulnerabilities: ${{ inputs.vulnerabilities }}
          verbose: ${{ inputs.verbose || 'false' }}
          docker-image: ${{ vars.AGP_DOCKER_IMAGE }}
          skip-docker-pull: 'true'
          create-pr: 'true'
          github-token: ${{ github.token }}
        env:
          AGP_API_URL: ${{ vars.AGP_API_URL }}
          AGP_API_TOKEN: ${{ secrets.AGP_API_TOKEN }}
